### Qwen3-VL-8B-Instruct -> CoLT + LaRe latent refocusing on the same 88,833 rows.
### This config intentionally matches the 78.73 four-loss baseline's data, update budget,
### seed and schedule.  Enable the architecture before model construction with:
###   COLT_LARE_REFOCUS=1
### See Markdown/idea/CER-CoLT_LaRe复现方案与实现说明.md for the complete env contract.

### model
model_name_or_path: /home/dataset-local/lkl/models/Qwen3-VL-8B-Instruct
image_max_pixels: 802816
video_max_pixels: 100352
video_maxlen: 128
video_fps: 2
trust_remote_code: true
disable_gradient_checkpointing: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: LLaMA-Factory/examples/deepspeed/ds_z3_8gpu.json

### dataset
dataset: onethinker_sft_image_nogrounding
template: qwen3_vl
dataset_dir: /home/dataset-local/lkl/datasets/CoLT_Train_Dataset
media_dir: /home/dataset-local/lkl/datasets/CoLT_Train_Dataset
use_fast_tokenizer: false
cutoff_len: 16384
overwrite_cache: false
preprocessing_num_workers: 32
preprocessing_batch_size: 32
tokenized_path: /home/dataset-local/lkl/cache/colt/qwen_base_colt88k_4loss_final_tokenized

### output
output_dir: /home/dataset-local/lkl/CoLT-reproduction/checkpoints/colt_qwen_base_colt88k_lare_final
logging_steps: 1
save_strategy: "no"
save_only_model: true
plot_loss: true
overwrite_output_dir: false
save_total_limit: 1

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
weight_decay: 1.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.02
bf16: true
ddp_timeout: 180000000
flash_attn: fa2
seed: 42
data_seed: 42

### eval
report_to: wandb
run_name: colt_qwen_base_colt88k_lare_final
